<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AngieInTech · Reel Thumbnail — Systems Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      font-family: Inter, system-ui, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .note {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      max-width: 1080px;
      line-height: 1.6;
    }

    .cover {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: #0f172a;
    }

    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .scrim-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 320px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72) 0%, rgba(15, 23, 42, 0.28) 55%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .scrim-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 520px;
      background: linear-gradient(0deg, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.55) 45%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 56px 48px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.35);
    }
    .logo .ai {
      background: linear-gradient(135deg, #7b8fff, #4fd1c5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .challenge-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(10px);
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    .center-spacer {
      flex: 1;
    }

    .hook-panel {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 28px;
      padding: 34px 36px;
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    }

    .hook-kicker {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7ee8d8;
      margin-bottom: 14px;
    }

    .hook-title {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 58px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.035em;
      color: #ffffff;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.3);
      margin-bottom: 18px;
    }

    .hook-title .accent {
      background: linear-gradient(105deg, #8ea4ff, #4fd1c5);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hook-sub {
      font-size: 28px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.88);
      font-weight: 500;
    }

    .cta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-top: 28px;
    }

    .cta-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1e3a5f, #2a9d8f);
      color: #ffffff;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 28px rgba(42, 157, 143, 0.35);
    }

    .cta-pill .keyword {
      background: rgba(255, 255, 255, 0.18);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .handle {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: -0.02em;
    }

    .divider {
      width: 64px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b4fd8, #2a9d8f);
      margin: 22px 0 0;
    }
  </style>
</head>
<body>
  <p class="note">Instagram Reel cover · 1080×1920 · Systems Challenge reel</p>

  <div id="reel-cover" class="cover">
    <img class="bg" src="./source-frame.png" alt="" />
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="content">
      <div class="topbar">
        <div class="logo">A<span class="ai">I</span>T angieintech.</div>
        <div class="challenge-chip">Challenge 🥊</div>
      </div>

      <div class="center-spacer"></div>

      <div class="hook-panel">
        <div class="hook-kicker">Si tu negocio todavía funciona así…</div>
        <h1 class="hook-title">5 cosas que hacen <span class="accent">desaparecer</span> tu negocio</h1>
        <p class="hook-sub">Sin IA vs. con sistemas simples. O te montas, o te quedas.</p>
        <div class="divider"></div>
        <div class="cta-row">
          <div class="cta-pill">Comenta <span class="keyword">SYSTEM</span></div>
          <div class="handle">@angieintech</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
